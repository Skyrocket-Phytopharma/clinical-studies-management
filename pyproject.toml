[project]
name = "clinical-studies"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "et-xmlfile==2.0.0",
  "openpyxl==3.1.5",
  "pip==26.3",
  "python-dotenv==1.2.4",
  "setuptools==84.2.1",
]
[tool.ruff]
line-length = 180

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
per-file-ignores = { "**/*.py" = [
    "BLE001",
    "E741",
    "I001",
    "RUF010",
    "RUF012",
    "RUF059",
    "PIE808",
    "PLC0206",
    "PLR0133",
    "S110",
    "SIM102",
    "SIM115",
    "UP004",
    "UP007",
  ]}

[tool.ruff.lint.isort]
known-first-party = ["core", "organisation", "test_sets", "users", "utils"]

[tool.pyright]
extraPaths = ["."]
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingModuleSource = "warning"
